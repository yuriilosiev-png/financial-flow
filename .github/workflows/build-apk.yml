name: Build Financial Flow APK
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'index.html'
      - 'icon-*.png'
      - 'ic-launcher-*.png'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Есть ли боевой ключ для Play. Секреты нельзя проверять в if напрямую —
      # поэтому через переменную окружения.
      HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # packages: '' — обязательно: пакет "tools" удалён из репозитория Google,
      # дефолтная установка падает (та же история, что в Планере 19.09.2026).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Gradle 8.11.1 — минимум для AGP 8.9.1.
      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      # Офлайн-копия интерфейса: index.html из корня → assets (снимок на момент сборки).
      - name: Copy index.html into assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Copy icons to app res
        run: |
          for d in hdpi xhdpi; do mkdir -p app/src/main/res/mipmap-$d; cp icon-192.png app/src/main/res/mipmap-$d/ic_launcher.png; done
          for d in xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; cp icon-512.png app/src/main/res/mipmap-$d/ic_launcher.png; done
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp ic-launcher-bg.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          cp ic-launcher-fg.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

      # Тестовый APK — всегда, подписан app/test.jks. Ставится поверх прошлого без удаления.
      - name: Build test APK
        run: gradle assembleRelease --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancialFlow-test-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # AAB для Google Play — только когда в секретах есть боевой ключ.
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release AAB
        if: env.HAS_RELEASE_KEY == 'true'
        run: gradle bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload AAB
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FinancialFlow-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
